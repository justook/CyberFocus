<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body {
    width: 320px; margin: 0; padding: 14px;
    font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif;
    background: #14141e; color: #ddd;
  }
  h1 { font-size: 14px; margin: 0 0 10px; color: #00f2ea; }
  #preview {
    background: rgba(255,255,255,0.06); border-radius: 8px;
    padding: 8px 10px; margin-bottom: 10px;
  }
  #pageTitle { font-weight: 600; color: #fff; margin-bottom: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pageUrl { font-size: 11px; color: #888;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; }
  input {
    width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 10px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; color: #fff; font-size: 12px;
  }
  button {
    width: 100%; padding: 9px 0; margin-bottom: 8px; border: none;
    border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  #add { background: #00f2ea; color: #000; font-weight: 600; }
  #add:hover { background: #7ffdf8; }
  #add:disabled { background: #555; color: #999; cursor: not-allowed; }
  #copy { background: rgba(255,255,255,0.1); color: #ddd; }
  #copy:hover { background: rgba(255,255,255,0.2); }
  #status { font-size: 12px; min-height: 16px; }
  .ok { color: #31c27c; } .warn { color: #f0b429; } .err { color: #ff5f56; }
  .tip { font-size: 11px; color: #666; margin-top: 8px; }
</style>
</head>
<body>
  <h1>CyberFocus 导航收藏</h1>
  <div id="preview">
    <div id="pageTitle">读取中…</div>
    <div id="pageUrl"></div>
  </div>
  <label for="page">导航页地址（填一次即可，之后自动记住）</label>
  <input id="page" type="text" placeholder="file:///D:/.../index.html 或 https://...">
  <button id="add" disabled>添加到导航页</button>
  <button id="copy">复制数据（备用通道）</button>
  <div id="status"></div>
  <div class="tip">首次投递本地页面（file://）需在扩展详情里开启「允许访问文件网址」。</div>
  <script src="popup.js"></script>
</body>
</html>
